# Convenience preset: single-node development.
# PD, Store, and Server pull the published Docker Hub images by default.
#
# Usage: helm install hg ./helm/hugegraph -f values-single.yaml

pd:
  replicas: 1
  image:
    repository: hugegraph/pd
    tag: 1.7.0
    pullPolicy: IfNotPresent
  antiAffinity: disabled
  pdb:
    enabled: false
  service:
    clusterIP: None
  storage:
    enabled: false
    size: 5Gi

store:
  replicas: 1
  image:
    repository: hugegraph/store
    tag: 1.7.0
    pullPolicy: IfNotPresent
  antiAffinity: disabled
  pdb:
    enabled: false
  storage:
    enabled: false
    size: 10Gi

server:
  replicas: 1
  image:
    repository: hugegraph/server
    tag: 1.7.0
    pullPolicy: IfNotPresent
  hpa:
    enabled: false
  service:
    clusterIP: None
  auth:
    enabled: true
    admin:
      autoGenerate: true
    token:
      autoGenerate: true

hubble:
  enabled: true
  mode: pd
  service:
    clusterIP: None
