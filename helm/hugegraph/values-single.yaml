# Convenience preset: single-node / local kind-minikube development.
# PD, Store, and Server use images you built from this tree (tag "local"),
# never Docker Hub. Hubble uses the prepared hugegraph/hubble image.
#
# From the repo root, then helm install -f values-single.yaml:
#   docker build -f hugegraph-pd/Dockerfile -t hugegraph/pd:local .
#   docker build -f hugegraph-store/Dockerfile -t hugegraph/store:local .
#   docker build -f hugegraph-server/Dockerfile-hstore -t hugegraph/server:local .
#   kind load docker-image hugegraph/pd:local hugegraph/store:local \
#     hugegraph/server:local --name hg
#
# Usage: helm install hg ./helm/hugegraph -f values-single.yaml

pd:
  replicas: 1
  image:
    repository: hugegraph/pd
    tag: local
    pullPolicy: Never
  antiAffinity: disabled
  pdb:
    enabled: false
  storage:
    size: 5Gi

store:
  replicas: 1
  image:
    repository: hugegraph/store
    tag: local
    pullPolicy: Never
  antiAffinity: disabled
  pdb:
    enabled: false
  storage:
    size: 10Gi

server:
  replicas: 1
  image:
    repository: hugegraph/server
    tag: local
    pullPolicy: Never
  hpa:
    enabled: false
  auth:
    enabled: true
    autoGenerateSecret: true

hubble:
  enabled: true
  mode: pd
