# Apply this file after docker-compose.dev.yml. It replaces only the local
# RocksDB owners. The HStore Server stays on Dockerfile-hstore.
name: hugegraph-single-topling

volumes:
  hg-pd-topling-data:
  hg-store-topling-data:

services:
  pd:
    image: ${TOPLING_PD_IMAGE:-local/hugegraph-pd:topling}
    pull_policy: ${TOPLING_IMAGE_PULL_POLICY:-build}
    platform: linux/amd64
    build:
      context: ..
      dockerfile: hugegraph-pd/Dockerfile
      target: topling
    environment:
      HG_PD_ROCKSDB_PROVIDER: topling
      HG_PD_DATA_PATH: /hugegraph-pd/topling-pd-data
      HG_PD_ENFORCE_PROVIDER_MARKER: "true"
    volumes:
      - hg-pd-topling-data:/hugegraph-pd/topling-pd-data

  store:
    image: ${TOPLING_STORE_IMAGE:-local/hugegraph-store:topling}
    pull_policy: ${TOPLING_IMAGE_PULL_POLICY:-build}
    platform: linux/amd64
    build:
      context: ..
      dockerfile: hugegraph-store/Dockerfile
      target: topling
    environment:
      HG_STORE_ROCKSDB_PROVIDER: topling
      HG_STORE_DATA_PATH: /hugegraph-store/topling-storage
      HG_STORE_ENFORCE_PROVIDER_MARKER: "true"
    volumes:
      - hg-store-topling-data:/hugegraph-store/topling-storage
