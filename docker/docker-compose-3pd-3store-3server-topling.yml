# Apply this file after docker-compose-3pd-3store-3server.yml. Build the
# local/hugegraph-{pd,store}:topling images before starting the stack.
name: hugegraph-3x3-topling

volumes:
  hg-pd0-topling-data:
  hg-pd1-topling-data:
  hg-pd2-topling-data:
  hg-store0-topling-data:
  hg-store1-topling-data:
  hg-store2-topling-data:

x-topling-pd: &topling-pd
  image: ${TOPLING_PD_IMAGE:-local/hugegraph-pd:topling}
  platform: linux/amd64
  pull_policy: ${TOPLING_IMAGE_PULL_POLICY:-never}
  environment:
    HG_PD_ROCKSDB_PROVIDER: topling
    HG_PD_DATA_PATH: /hugegraph-pd/topling-pd-data
    HG_PD_ENFORCE_PROVIDER_MARKER: "true"

x-topling-store: &topling-store
  image: ${TOPLING_STORE_IMAGE:-local/hugegraph-store:topling}
  platform: linux/amd64
  pull_policy: ${TOPLING_IMAGE_PULL_POLICY:-never}
  environment:
    HG_STORE_ROCKSDB_PROVIDER: topling
    HG_STORE_DATA_PATH: /hugegraph-store/topling-storage
    HG_STORE_ENFORCE_PROVIDER_MARKER: "true"

services:
  pd0:
    <<: *topling-pd
    volumes:
      - hg-pd0-topling-data:/hugegraph-pd/topling-pd-data

  pd1:
    <<: *topling-pd
    volumes:
      - hg-pd1-topling-data:/hugegraph-pd/topling-pd-data

  pd2:
    <<: *topling-pd
    volumes:
      - hg-pd2-topling-data:/hugegraph-pd/topling-pd-data

  store0:
    <<: *topling-store
    volumes:
      - hg-store0-topling-data:/hugegraph-store/topling-storage

  store1:
    <<: *topling-store
    volumes:
      - hg-store1-topling-data:/hugegraph-store/topling-storage

  store2:
    <<: *topling-store
    volumes:
      - hg-store2-topling-data:/hugegraph-store/topling-storage
