# Apply this file after docker-compose.yml. It replaces only the standalone
# Server runtime and data root; HStore services are not part of this topology.
name: hugegraph-standalone-topling

volumes:
  server-topling-data:

services:
  server:
    image: ${TOPLING_SERVER_IMAGE:-local/hugegraph:topling}
    pull_policy: ${TOPLING_IMAGE_PULL_POLICY:-build}
    platform: linux/amd64
    build:
      context: ..
      dockerfile: hugegraph-server/Dockerfile
      target: topling
    environment:
      HG_SERVER_ROCKSDB_PROVIDER: topling
      HG_SERVER_DATA_PATH: /hugegraph-server/topling-data
      HG_SERVER_ENFORCE_PROVIDER_MARKER: "true"
    volumes: !override
      - server-topling-data:/hugegraph-server/topling-data
