name: Apply schema review fixes

on:
  issue_comment:
    types: [created]

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: >-
      github.event.issue.number == 374 &&
      github.event.issue.pull_request &&
      github.event.comment.body == '/apply-schema-review-fixes-374'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/schema-cache-events-3235
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify expected branch head
        run: test "$(git rev-parse HEAD)" = "6dc4691c59c766d0b2d9580a612ba53f14ab195d"

      - name: Apply focused review fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          DOCS = Path("docs/server-runtime.md")
          SOURCE = Path(
              "hugegraph-server/hugegraph-core/src/main/java/org/apache/"
              "hugegraph/backend/cache/CachedSchemaTransactionV2.java"
          )
          TESTS = Path(
              "hugegraph-server/hugegraph-test/src/main/java/org/apache/"
              "hugegraph/unit/cache/CachedSchemaTransactionV2Test.java"
          )

          texts = {
              DOCS: DOCS.read_text(),
              SOURCE: SOURCE.read_text(),
              TESTS: TESTS.read_text(),
          }

          def replace_once(path: Path, old: str, new: str) -> None:
              text = texts[path]
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{path}: expected one match, found {count}: {old[:100]!r}"
                  )
              texts[path] = text.replace(old, new, 1)

          replace_once(
              DOCS,
              """- Normal change notifications on the same Server share a fixed 1-second window per
  `(graphSpace, graph)`. The first change starts the window without an immediate
  broadcast; later changes do not reset its deadline. Changes during a publish queue
  another window. Local cache updates and invalidation still happen immediately.
  The window is a batching delay, not a propagation deadline: a shared scheduler,
  slow PD calls, retries and watch delivery can add time. Different Servers batch
  independently, and one long-running script can span several windows.
""",
              """- Normal change notifications on the same Server share one scheduled clear per
  `(graphSpace, graph)`. The first change schedules it after 1 second without an
  immediate broadcast; later changes do not replace or postpone that callback. They
  can still join the same clear until its callback removes the window. A shared
  scheduler or a slow PD call can therefore extend both the effective batching window
  and propagation latency; retries and watch delivery can add more time. A change
  after the window is removed, including during publication, schedules another clear.
  Local cache updates and invalidation still happen immediately. Different Servers
  batch independently, and one long-running script can span several windows.
""",
          )
          replace_once(
              DOCS,
              """  Batching provides no index-completeness guarantee. Create indexes while writes to
  the label are stopped, or rebuild the index afterwards, when a complete index
  is required.
""",
              """  Batching provides no index-completeness guarantee. For a complete index, stop
  writes to the label and drain in-flight writes, wait for the create or rebuild
  task to succeed, then verify on every write-serving Server that the index and its
  association with the base label are visible before resuming writes. Do not replace
  that verification with a fixed wait.
""",
          )
          replace_once(
              DOCS,
              """- A Server that stops for good between a schema write and its event, including while
  the event waits in the 1-second window. The other Servers keep what they cached until
  the next schema change of that graph or their next watch restart.
""",
              """- A Server that stops for good between a schema write and its event, including while
  the event waits for its scheduled clear. The other Servers keep what they cached
  until the next schema change of that graph or their next watch restart.
""",
          )

          replace_once(
              SOURCE,
              """    /**
     * Queue a clear event after the schema write. Changes of this graph share
     * a fixed window; local cache changes have already happened. A failed
     * publish is kept and sent again, see
     * {@link PendingClearEvents}.
     */
""",
              """    /**
     * Queue a clear event after the schema write. Changes of this graph share
     * one scheduled clear until its callback removes the window; local cache
     * changes have already happened. A failed publish is kept and sent again,
     * see {@link PendingClearEvents}.
     */
""",
          )
          replace_once(
              SOURCE,
              """     * Normal changes share one fixed window per graph. Remove the window
     * before publishing so a concurrent change can start the next one. Graph
     * open and watch recovery bypass this delay. No task runs while idle.
""",
              """     * The first normal change of a graph schedules a clear after one second.
     * Later changes share it until its callback removes the window; scheduler
     * backlog can therefore extend the effective window. Remove the window
     * before publishing so a concurrent change can start the next one. Graph
     * open and watch recovery bypass this delay. No task runs while idle.
""",
          )
          replace_once(
              SOURCE,
              """                // Later changes share this deadline instead of postponing it.
""",
              """                // Later changes share this scheduled callback until flush()
                // removes the window; they don't replace or postpone it.
""",
          )

          replace_once(
              TESTS,
              "testBurstSharesOneFixedWindowWithoutAnImmediateEvent",
              "testBurstSharesOneScheduledWindowWithoutAnImmediateEvent",
          )
          replace_once(
              TESTS,
              "// Later edits neither send immediately nor replace the first deadline.",
              "// Later edits neither send immediately nor replace the scheduled flush.",
          )
          replace_once(
              TESTS,
              "// A later isolated edit gets a new bounded window.",
              "// A later isolated edit gets a new scheduled clear.",
          )

          replace_once(
              TESTS,
              """    public void testUpdatePublishes() {
        this.tx.addPropertyKey(this.propertyKey(1, "name", 1));
        this.publisher.reset();
""",
              """    public void testUpdatePublishes() {
        this.tx.addPropertyKey(this.propertyKey(1, "name", 1));
        flushScheduledClearEvents();
        this.publisher.reset();
""",
          )
          replace_once(
              TESTS,
              """        PropertyKey pk = this.propertyKey(1, "name", 1);
        this.tx.addPropertyKey(pk);
        this.publisher.reset();

        this.tx.updateSchemaStatus(pk, SchemaStatus.INVALID);
""",
              """        PropertyKey pk = this.propertyKey(1, "name", 1);
        this.tx.addPropertyKey(pk);
        flushScheduledClearEvents();
        this.publisher.reset();

        this.tx.updateSchemaStatus(pk, SchemaStatus.INVALID);
""",
          )
          replace_once(
              TESTS,
              """            PropertyKey pk = this.propertyKey(1, "name", 1);
            this.tx.addPropertyKey(pk);
            this.publisher.reset();

            this.tx.removeSchema(pk);
""",
              """            PropertyKey pk = this.propertyKey(1, "name", 1);
            this.tx.addPropertyKey(pk);
            flushScheduledClearEvents();
            this.publisher.reset();

            this.tx.removeSchema(pk);
""",
          )
          replace_once(
              TESTS,
              """        for (String event : new String[]{Events.STORE_CLEAR, Events.STORE_TRUNCATE}) {
            this.tx.addPropertyKey(this.propertyKey(1, "name", 1));
            this.publisher.reset();
""",
              """        for (String event : new String[]{Events.STORE_CLEAR, Events.STORE_TRUNCATE}) {
            this.tx.addPropertyKey(this.propertyKey(1, "name", 1));
            flushScheduledClearEvents();
            this.publisher.reset();
""",
          )
          replace_once(
              TESTS,
              """        this.publisher.reset();
        storeListener.event(new Event(this.provider, Events.STORE_INIT));
        Assert.assertEquals(0, this.publisher.count(this.graphName));
""",
              """        this.publisher.reset();
        this.withWindowScheduler(tasks -> {
            storeListener.event(new Event(this.provider, Events.STORE_INIT));
            Assert.assertTrue(tasks.isEmpty());
            Assert.assertTrue(scheduledClears().isEmpty());
            Assert.assertEquals(0, this.publisher.count(this.graphName));
        });
""",
          )
          replace_once(
              TESTS,
              """    public void testSchemaClearPublishes() {
        this.tx.addPropertyKey(this.propertyKey(1, "name", 1));
        this.publisher.reset();
""",
              """    public void testSchemaClearPublishes() {
        this.tx.addPropertyKey(this.propertyKey(1, "name", 1));
        flushScheduledClearEvents();
        this.publisher.reset();
""",
          )
          replace_once(
              TESTS,
              """        this.tx.addPropertyKey(this.propertyKey(1, "name", 1));
        this.tx.getPropertyKeys();
        this.publisher.reset();

        // The id key is replaced, then the store fails before the name key
""",
              """        this.tx.addPropertyKey(this.propertyKey(1, "name", 1));
        this.tx.getPropertyKeys();
        flushScheduledClearEvents();
        this.publisher.reset();

        // The id key is replaced, then the store fails before the name key
""",
          )
          replace_once(
              TESTS,
              """    public void testFailedWriteKeepsItsEventWhenThePublishFailsToo() throws Exception {
        this.tx.addPropertyKey(this.propertyKey(1, "name", 1));
        this.publisher.reset();
        this.publisher.fail = true;
""",
              """    public void testFailedWriteKeepsItsEventWhenThePublishFailsToo() throws Exception {
        this.tx.addPropertyKey(this.propertyKey(1, "name", 1));
        flushScheduledClearEvents();
        this.publisher.reset();
        this.publisher.fail = true;
""",
          )
          replace_once(
              TESTS,
              """        PropertyKey pk = this.propertyKey(1, "name", 1);
        this.tx.addPropertyKey(pk);
        Assert.assertNotNull(this.tx.getPropertyKey("name"));
        this.publisher.reset();

        // The name key is deleted, then the store fails before the id key
""",
              """        PropertyKey pk = this.propertyKey(1, "name", 1);
        this.tx.addPropertyKey(pk);
        Assert.assertNotNull(this.tx.getPropertyKey("name"));
        flushScheduledClearEvents();
        this.publisher.reset();

        // The name key is deleted, then the store fails before the id key
""",
          )

          replace_once(
              TESTS,
              """    @Test
    public void testEveryPublishComesAfterItsStoreWrite() {
        // What another Server would read from the store when the event arrives
        List<Integer> seen = new ArrayList<>();
        this.publisher.intercept = () -> {
            PropertyKey stored = this.otherServer.getPropertyKey(GRAPH_SPACE, this.graphName,
                                                                 IdGenerator.of(1));
            seen.add(stored == null ? -1 : this.version(stored));
        };
        PropertyKey pk = this.propertyKey(1, "name", 1);
        this.tx.addPropertyKey(pk);
        flushScheduledClearEvents();
        this.tx.updatePropertyKey(this.propertyKey(1, "name", 2));
        flushScheduledClearEvents();
        this.tx.removeSchema(pk);
        flushScheduledClearEvents();
        this.tx.addPropertyKey(this.propertyKey(1, "name", 3));
        flushScheduledClearEvents();
        this.tx.clear();
        flushScheduledClearEvents();
        this.publisher.intercept = null;

        // added, updated, removed, added again, cleared
        Assert.assertEquals(Arrays.asList(1, 2, -1, 3, -1), seen);
    }
""",
              """    @Test
    public void testEveryPublishComesAfterItsStoreWrite() {
        // What another Server would read from the store when the event arrives
        List<Integer> seen = new ArrayList<>();
        this.publisher.intercept = () -> {
            PropertyKey stored = this.otherServer.getPropertyKey(GRAPH_SPACE, this.graphName,
                                                                 IdGenerator.of(1));
            seen.add(stored == null ? -1 : this.version(stored));
        };
        PropertyKey pk = this.propertyKey(1, "name", 1);
        try {
            this.withWindowScheduler(tasks -> {
                this.assertClearQueuedAfterStoreWrite(
                        tasks, this.store.stopNext("put", "/NAME/name"),
                        () -> this.tx.addPropertyKey(pk));
                this.assertClearQueuedAfterStoreWrite(
                        tasks, this.store.stopNext("put", "/NAME/name"),
                        () -> this.tx.updatePropertyKey(
                                this.propertyKey(1, "name", 2)));
                this.assertClearQueuedAfterStoreWrite(
                        tasks, this.store.stopNext("delete", "/ID/1"),
                        () -> this.tx.removeSchema(pk));
                this.assertClearQueuedAfterStoreWrite(
                        tasks, this.store.stopNext("put", "/NAME/name"),
                        () -> this.tx.addPropertyKey(
                                this.propertyKey(1, "name", 3)));
                this.assertClearQueuedAfterStoreWrite(
                        tasks, this.store.stopNext("delete", "/SCHEMA"),
                        this.tx::clear);
            });
        } finally {
            this.publisher.intercept = null;
        }

        // added, updated, removed, added again, cleared
        Assert.assertEquals(Arrays.asList(1, 2, -1, 3, -1), seen);
    }
""",
          )

          replace_once(
              TESTS,
              """    private PropertyKey propertyKey(int id, String name, int version) {
""",
              """    private void assertClearQueuedAfterStoreWrite(List<Runnable> tasks,
                                                  Gate gate,
                                                  Runnable write) {
        int tasksBefore = tasks.size();
        Future<?> future = this.executor.submit(write);
        gate.awaitReached();
        try {
            Assert.assertEquals(tasksBefore, tasks.size());
            Assert.assertTrue(scheduledClears().isEmpty());
        } finally {
            gate.open();
        }
        try {
            future.get(WAIT_SECONDS, TimeUnit.SECONDS);
        } catch (InterruptedException e) {
            Thread.currentThread().interrupt();
            throw new AssertionError("Interrupted while waiting for schema write", e);
        } catch (ExecutionException | TimeoutException e) {
            throw new AssertionError("Schema write did not finish", e);
        }
        Assert.assertEquals(tasksBefore + 1, tasks.size());
        Assert.assertEquals(1, scheduledClears().size());
        tasks.get(tasksBefore).run();
        Assert.assertTrue(scheduledClears().isEmpty());
    }

    private PropertyKey propertyKey(int id, String name, int version) {
""",
          )

          for path, text in texts.items():
              path.write_text(text)
          PY

      - name: Verify focused diff
        shell: bash
        run: |
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            docs/server-runtime.md \
            hugegraph-server/hugegraph-core/src/main/java/org/apache/hugegraph/backend/cache/CachedSchemaTransactionV2.java \
            hugegraph-server/hugegraph-test/src/main/java/org/apache/hugegraph/unit/cache/CachedSchemaTransactionV2Test.java \
            | sort)"
          test "$changed" = "$expected"

      - name: Check formatting
        run: |
          mvn -ntp editorconfig:check \
            -pl hugegraph-server/hugegraph-test -am

      - name: Run focused schema-cache tests
        run: |
          mvn -ntp test \
            -pl hugegraph-server/hugegraph-test -am \
            -P unit-test \
            -Dtest=CachedSchemaTransactionV2Test,CachedSchemaTransactionTest \
            -Dsurefire.failIfNoSpecifiedTests=false

      - name: Publish clean commit
        shell: bash
        env:
          EXPECTED_SHA: 6dc4691c59c766d0b2d9580a612ba53f14ab195d
          BRANCH: fix/schema-cache-events-3235
        run: |
          git config user.name "Imba Jin"
          git config user.email "jin@apache.org"
          git add docs/server-runtime.md \
            hugegraph-server/hugegraph-core/src/main/java/org/apache/hugegraph/backend/cache/CachedSchemaTransactionV2.java \
            hugegraph-server/hugegraph-test/src/main/java/org/apache/hugegraph/unit/cache/CachedSchemaTransactionV2Test.java
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git diff --cached --check
          git commit -m "fix(test): address schema clear-window review findings"
          git push --force-with-lease=refs/heads/${BRANCH}:${EXPECTED_SHA} \
            origin HEAD:${BRANCH}
