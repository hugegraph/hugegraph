name: "Docker Build CI"

env:
  BINFMT_IMAGE: >-
    tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

on:
  push:
    branches:
      - master
      - 'release-*'
  pull_request:
    paths:
      - '**/Dockerfile*'
      - '.dockerignore'
      - '.github/workflows/docker-build-ci.yml'
      - 'pom.xml'
      - 'hugegraph-pd/hg-pd-grpc/pom.xml'
      - 'hugegraph-server/pom.xml'
      - 'hugegraph-server/hugegraph-core/pom.xml'
      - 'hugegraph-server/hugegraph-rocksdb/pom.xml'
      - 'hugegraph-server/hugegraph-dist/pom.xml'
      - 'hugegraph-server/hugegraph-dist/docker/**'
      - 'hugegraph-server/hugegraph-dist/src/main/resources/backend.properties'
      - 'hugegraph-server/hugegraph-dist/src/assembly/static/**'
      - 'hugegraph-server/hugegraph-dist/src/assembly/travis/check-rocksdb-only-dist.sh'
      - 'hugegraph-server/hugegraph-dist/src/assembly/travis/*smoke*'

jobs:
  docker-build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - hugegraph-pd/Dockerfile
          - hugegraph-store/Dockerfile
          - hugegraph-server/Dockerfile-hstore

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ${{ matrix.dockerfile }}
        run: |
          IMAGE_ID=$(docker build -q -f ${{ matrix.dockerfile }} .)
          echo "Built: $IMAGE_ID"
          HC=$(docker inspect --format='{{json .Config.Healthcheck}}' "$IMAGE_ID")
          echo "Healthcheck: $HC"
          [[ "$HC" != "null" ]] || { echo "ERROR: HEALTHCHECK missing in ${{ matrix.dockerfile }}"; exit 1; }

  server-runtime-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.arch == 'riscv64' && 90 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64, riscv64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up emulation
        if: matrix.arch != 'amd64'
        run: |
          docker run --privileged --rm "$BINFMT_IMAGE" \
            --install "${{ matrix.arch }}"

      - name: Set up Docker Buildx
        run: |
          BUILDER_NAME="hugegraph-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.arch }}"
          echo "BUILDER_NAME=$BUILDER_NAME" >> "$GITHUB_ENV"
          docker buildx create --name "$BUILDER_NAME" \
            --driver docker-container --use
          docker buildx inspect --bootstrap

      - name: Build HugeGraph Server for linux/${{ matrix.arch }}
        run: |
          docker buildx build \
            --platform linux/${{ matrix.arch }} \
            --load \
            --tag hugegraph-server-smoke:${{ matrix.arch }} \
            --file hugegraph-server/Dockerfile .

      - name: Check healthcheck and run runtime smoke
        env:
          IMAGE: hugegraph-server-smoke:${{ matrix.arch }}
          ARCH: ${{ matrix.arch }}
        run: |
          HC=$(docker inspect --format='{{json .Config.Healthcheck}}' "$IMAGE")
          echo "Healthcheck: $HC"
          [[ "$HC" != "null" ]] || { echo "ERROR: HEALTHCHECK missing"; exit 1; }
          hugegraph-server/hugegraph-dist/src/assembly/travis/run-docker-runtime-smoke-test.sh \
            "$IMAGE" "$ARCH"

      - name: Verify native RISC-V Maven build
        if: matrix.arch == 'riscv64'
        env:
          IMAGE: hugegraph-server-smoke:riscv64
        run: |
          CONTAINER_NAME="hugegraph-riscv64-maven-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm --force --volumes "$CONTAINER_NAME" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach --platform linux/riscv64 \
            --name "$CONTAINER_NAME" --entrypoint sleep "$IMAGE" infinity
          docker exec "$CONTAINER_NAME" mkdir -p /workspace
          git ls-files -z | tar --null --files-from=- -cf - | \
            docker exec -i "$CONTAINER_NAME" tar -xf - -C /workspace

          docker exec "$CONTAINER_NAME" bash -euo pipefail -c '
            test "$(uname -m)" = riscv64
            apt-get -q update
            apt-get -q install -y --no-install-recommends \
              maven protobuf-compiler protobuf-compiler-grpc-java-plugin
            java -version
            test -x /usr/bin/protoc
            test -x /usr/bin/grpc_java_plugin
            # Limit JIT work for the QEMU build; runtime smoke uses the default JVM.
            export MAVEN_OPTS="-XX:TieredStopAtLevel=1 -XX:ActiveProcessorCount=2"
            cd /workspace
            mvn clean package -B -ntp -Drocksdb-only \
              -P riscv64-protobuf-tools \
              -pl hugegraph-server/hugegraph-dist -am \
              -Dmaven.test.skip=true -Dmaven.javadoc.skip=true
            hugegraph-server/hugegraph-dist/src/assembly/travis/check-rocksdb-only-dist.sh \
              hugegraph-server/apache-hugegraph-server-*/
          '

      - name: Clean up Docker resources
        if: always()
        env:
          IMAGE: hugegraph-server-smoke:${{ matrix.arch }}
        run: |
          docker image rm "$IMAGE" >/dev/null 2>&1 || true
          if [[ -n "${BUILDER_NAME:-}" ]]; then
            docker buildx rm "$BUILDER_NAME" >/dev/null 2>&1 || true
          fi
