name: "Docker Build CI"

on:
  push:
    branches:
      - master
      - 'release-*'
  pull_request:
    paths:
      - '**/Dockerfile*'
      - '.dockerignore'
      - 'hugegraph-server/hugegraph-dist/docker/**'
      - 'hugegraph-server/hugegraph-dist/src/assembly/static/bin/config-tool.sh'
      - 'hugegraph-server/hugegraph-dist/src/assembly/static/bin/enable-auth.sh'
      - 'hugegraph-server/hugegraph-dist/src/assembly/static/bin/init-store.sh'
      - 'hugegraph-server/hugegraph-dist/src/main/java/org/apache/hugegraph/cmd/ConfigTool.java'
      - 'hugegraph-server/hugegraph-dist/src/main/java/org/apache/hugegraph/cmd/InitStore.java'
      - 'hugegraph-server/hugegraph-api/src/main/java/org/apache/hugegraph/auth/StandardAuthenticator.java'
      - 'hugegraph-server/hugegraph-api/src/main/java/org/apache/hugegraph/config/ServerOptions.java'
      - '**/docker/docker-entrypoint.sh'

jobs:
  entrypoint-test:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Server entrypoint smoke tests
        run: hugegraph-server/hugegraph-dist/docker/test/test-docker-entrypoint.sh

  docker-build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - hugegraph-pd/Dockerfile
          - hugegraph-store/Dockerfile
          - hugegraph-server/Dockerfile
          - hugegraph-server/Dockerfile-hstore

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ${{ matrix.dockerfile }}
        run: |
          IMAGE_ID=$(docker build -q -f ${{ matrix.dockerfile }} .)
          echo "Built: $IMAGE_ID"
          HC=$(docker inspect --format='{{json .Config.Healthcheck}}' "$IMAGE_ID")
          echo "Healthcheck: $HC"
          [[ "$HC" != "null" ]] || { echo "ERROR: HEALTHCHECK missing in ${{ matrix.dockerfile }}"; exit 1; }
          if [[ "${{ matrix.dockerfile }}" == hugegraph-server/Dockerfile* ]]; then
            RO_CONF=$(mktemp)
            printf 'restserver.url=http://0.0.0.0:8080\n' > "$RO_CONF"
            if docker run --rm --entrypoint bash \
                 -v "$RO_CONF:/tmp/rest-server.properties:ro" "$IMAGE_ID" \
                 -c './bin/config-tool.sh set /tmp/rest-server.properties init_store.enabled false; status=$?; [[ $status -eq 0 ]] || compgen -G "/tmp/rest-server.properties.tmp.*" >/dev/null; unexpected=$?; [[ $unexpected -eq 0 ]] && exit 0; exit "$status"'; then
              echo "ERROR: ConfigTool rewrote a read-only bind mount or leaked a scratch file"
              exit 1
            fi
            grep -qxF 'restserver.url=http://0.0.0.0:8080' "$RO_CONF"
          fi
