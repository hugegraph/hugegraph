name: Validate schema review fixes

on:
  push:
    branches:
      - test-schema-review-fix

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Restore reviewed target files
        run: |
          git checkout 6dc4691c59c766d0b2d9580a612ba53f14ab195d -- \
            docs/server-runtime.md \
            hugegraph-server/hugegraph-core/src/main/java/org/apache/hugegraph/backend/cache/CachedSchemaTransactionV2.java \
            hugegraph-server/hugegraph-test/src/main/java/org/apache/hugegraph/unit/cache/CachedSchemaTransactionV2Test.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Apply minimal review fixes
        run: python3 .github/scripts/apply-schema-review-fixes.py

      - name: Check formatting and whitespace
        run: |
          git diff --check
          mvn -ntp editorconfig:check \
            -pl hugegraph-server/hugegraph-test -am

      - name: Run focused schema-cache tests
        run: |
          mvn -ntp test \
            -pl hugegraph-server/hugegraph-test -am \
            -P unit-test \
            -Dtest=CachedSchemaTransactionV2Test,CachedSchemaTransactionTest

      - name: Package validated files
        uses: actions/upload-artifact@v4
        with:
          name: schema-review-fix
          path: |
            docs/server-runtime.md
            hugegraph-server/hugegraph-core/src/main/java/org/apache/hugegraph/backend/cache/CachedSchemaTransactionV2.java
            hugegraph-server/hugegraph-test/src/main/java/org/apache/hugegraph/unit/cache/CachedSchemaTransactionV2Test.java
          if-no-files-found: error
          retention-days: 1

