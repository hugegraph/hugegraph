name: Stage PR 343 tested fix

on:
  push:
    branches:
      - codex/pd-store-drain-state-20261027
    paths:
      - .github/workflows/stage-pr343-tested-fix.yml

permissions:
  contents: write

jobs:
  stage-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: codex/pd-store-drain-state-20261027
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Reuse the reviewed patch and validation steps
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          source = Path('.github/workflows/fix-pr343-duplicate-drain.yml')
          lines = source.read_text().splitlines()
          wanted = [
              'Apply focused fix and regression',
              'Format and validate the focused change',
              'Run focused PD drain tests',
          ]
          scripts = {}
          current = None
          index = 0
          while index < len(lines):
              line = lines[index]
              if line.startswith('      - name: '):
                  current = line[len('      - name: '):]
              if current in wanted and line == '        run: |':
                  index += 1
                  block = []
                  while index < len(lines):
                      item = lines[index]
                      if item.startswith('          '):
                          block.append(item[10:])
                          index += 1
                          continue
                      if not item.strip():
                          block.append('')
                          index += 1
                          continue
                      break
                  scripts[current] = '\n'.join(block) + '\n'
                  continue
              index += 1

          for name in wanted:
              script = scripts.get(name)
              if not script:
                  raise SystemExit(f'Missing workflow step: {name}')
              print(f'Running reused step: {name}', flush=True)
              subprocess.run(
                  ['bash', '-e', '-u', '-o', 'pipefail', '-c', script],
                  check=True,
              )
          PY

      - name: Push the tested fix to a review branch
        shell: bash
        run: |
          git config user.name 'chatgpt-codex-connector[bot]'
          git config user.email 'chatgpt-codex-connector[bot]@users.noreply.github.com'
          git add \
            hugegraph-pd/hg-pd-core/src/main/java/org/apache/hugegraph/pd/StoreNodeService.java \
            hugegraph-pd/hg-pd-service/src/main/java/org/apache/hugegraph/pd/service/PDService.java \
            hugegraph-pd/hg-pd-test/src/main/java/org/apache/hugegraph/pd/core/StoreDrainTest.java
          git rm \
            .github/workflows/fix-pr343-duplicate-drain.yml \
            .github/workflows/stage-pr343-tested-fix.yml
          git diff --cached --check
          git commit -m 'fix(pd): avoid duplicate drain migration submission'
          git push origin HEAD:refs/heads/codex/pr343-duplicate-drain-fix-20261028
